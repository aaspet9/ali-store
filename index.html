      if (!name || !phone || !pass) { alert("براہ کرم تمام معلومات (نام، موبائل نمبر اور پاسورڈ) درج کریں!"); return; }

      const userObj = { name: name, phone: phone, pass: pass };
      usersDb.child(phone).set(userObj).then(() => {
        currentUser = userObj;
        localStorage.setItem('app_user_data', JSON.stringify(userObj));
        checkUserSession();
        alert("لاگ ان کامیا ہو گیا ہے! 🚀");
      });
    }

    /* Secure Share Functionality */
    function shareProduct(key, title, link) {
      const shareData = { title: title, text: `Check out this deal: ${title}`, url: link };
      if (navigator.share) {
        navigator.share(shareData).then(() => {
          db.child(key).child('shares').transaction((current) => (current || 0) + 1);
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(`${title} - ${link}`).then(() => {
          alert("Link copied to clipboard!");
          db.child(key).child('shares').transaction((current) => (current || 0) + 1);
        });
      }
    }

    function openUploadModal() { 
      if (!currentUser) { checkUserSession(); return; }
      document.getElementById('uploadModal').style.display = 'flex'; 
    }
    function closeUploadModal() { document.getElementById('uploadModal').style.display = 'none'; }

    function handleUserImages(e) {
      userFiles = Array.from(e.target.files);
      if(userFiles.length > 0) {
        document.getElementById('uFileText').innerText = `${userFiles.length} Images Selected ✅`;
      }
    }

    function compressImage(file, maxWidth = 1000, quality = 0.75) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => {
              resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
            }, 'image/jpeg', quality);
          };
        };
      });
    }

    async function submitUserProduct() {
      const langObj = translations[currentLang];
      const title = document.getElementById('uTitle').value.trim();
      const category = document.getElementById('uCategory').value;
      const price = document.getElementById('uPrice').value.trim();
      const link = document.getElementById('uLink').value.trim();
      const loader = document.getElementById('uLoader');

      if (!title || !link) { alert(langObj.msgAlertNeedTitle); return; }
      if (userFiles.length === 0) { alert(langObj.msgAlertNeedImg); return; }

      loader.style.display = "block";
      let imgUrls = [];

      for (let file of userFiles) {
        const compressedFile = await compressImage(file);
        const formData = new FormData();
        formData.append("image", compressedFile);
        
        try {
          const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
          const imgData = await res.json();
          if (imgData.success) imgUrls.push(imgData.data.url);
        } catch(e){}
      }

      if (imgUrls.length === 0) {
        loader.style.display = "none";
        alert(langObj.msgAlertImgErr);
        return;
      }

      pendingDb.push({
        title: title,
        category: category,
        price: price || "Best Price",
        link: link,
        images: imgUrls,
        img: imgUrls[0],
        pinned: false,
        timestamp: Date.now(),
        shares: 0,
        userPhone: currentUser ? currentUser.phone : 'Guest',
        userName: currentUser ? currentUser.name : 'Guest'
      }).then(() => {
        loader.style.display = "none";
        alert(langObj.msgAlertSuccess);
        closeUploadModal();
      });
    }

    function switchLanguage(lang) {
      currentLang = lang;
      const langObj = translations[lang];

      document.getElementById('htmlTag').setAttribute('dir', langObj.dir);
      document.getElementById('htmlTag').setAttribute('lang', lang);
      document.getElementById('headerText').innerText = langObj.title;

      document.getElementById('btnUploadMain').innerText = langObj.btnUploadMain;
      document.getElementById('btnPromoMain').innerText = langObj.btnPromoMain;
      document.getElementById('modalHeading').innerText = langObj.modalHeading;
      document.getElementById('lblTitle').innerText = langObj.lblTitle;
      document.getElementById('uTitle').placeholder = langObj.phTitle;
      document.getElementById('lblCategory').innerText = langObj.lblCategory;
      document.getElementById('lblPrice').innerText = langObj.lblPrice;
      document.getElementById('lblLink').innerText = langObj.lblLink;
      document.getElementById('lblImages').innerText = langObj.lblImages;
      document.getElementById('uFileText').innerText = langObj.uFileText;
      document.getElementById('btnSubmitModal').innerText = langObj.btnSubmitModal;

      const modalBox = document.querySelector('.modal-box');
      if (modalBox) modalBox.style.textAlign = langObj.dir === 'rtl' ? 'right' : 'left';

      ['btnUr', 'btnEn', 'btnAr', 'btnHi'].forEach(btn => document.getElementById(btn).classList.remove('active'));
      if (lang === 'ur') document.getElementById('btnUr').classList.add('active');
      if (lang === 'en') document.getElementById('btnEn').classList.add('active');
      if (lang === 'ar') document.getElementById('btnAr').classList.add('active');
      if (lang === 'hi') document.getElementById('btnHi').classList.add('active');

      renderCategories();
      renderModalCategories();
      renderProducts();
    }

    function renderModalCategories() {
      const select = document.getElementById('uCategory');
      select.innerHTML = '';
      const catObj = translations[currentLang].cats;
      Object.keys(catObj).forEach(key => {
        if(key !== 'all') {
          select.innerHTML += `<option value="${key}">${catObj[key]}</option>`;
        }
      });
    }

    function renderCategories() {
      const catBar = document.getElementById('categoryBar');
      catBar.innerHTML = '';
      Object.keys(translations[currentLang].cats).forEach(key => {
        const activeClass = key === currentCategory ? 'active' : '';
        catBar.innerHTML += `<button class="cat-btn ${activeClass}" onclick="filterCategory('${key}')">${translations[currentLang].cats[key]}</button>`;
      });
    }

    function filterCategory(catKey) {
      currentCategory = catKey;
      renderCategories();
      renderProducts();
    }

    function moveSlide(cardKey, direction, totalImages) {
      if (!sliderIndices[cardKey]) sliderIndices[cardKey] = 0;
      sliderIndices[cardKey] += direction;
      if (sliderIndices[cardKey] < 0) sliderIndices[cardKey] = totalImages - 1;
      if (sliderIndices[cardKey] >= totalImages) sliderIndices[cardKey] = 0;
      const track = document.getElementById(`track-${cardKey}`);
      if (track) track.style.transform = `translateX(${sliderIndices[cardKey] * 100}%)`;
    }

    function getFinalLink(originalLink, itemIndex) {
      if ((itemIndex + 1) % 5 === 0 && adminTrackingTag) {
        if(originalLink.includes('?')) {
          return originalLink + "&aff_fcid=" + adminTrackingTag;
        } else {
          return originalLink + "?aff_fcid=" + adminTrackingTag;
        }
      }
      return originalLink;
    }

    function createAdBannerElement() {
      const adDiv = document.createElement('div');
      adDiv.className = 'adsterra-in-grid-banner';
      const iframe = document.createElement('iframe');
      iframe.style.width = '320px'; iframe.style.height = '50px'; iframe.style.border = 'none'; iframe.style.overflow = 'hidden';

      const iframeDoc = `
        <!DOCTYPE html><html><head><style>body{margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;}</style></head>
        <body>
          <script type="text/javascript">
            atOptions = { 'key' : 'cf3494f4a6b7bb56bec2bab7b59f7f36', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
          <\/script>
          <script type="text/javascript" src="https://bauval.org/22/cf3494f4a6b7bb56bec2bab7b59f7f36"><\/script>
        </body></html>
      `;
      adDiv.appendChild(iframe);
      setTimeout(() => {
        const doc = iframe.contentWindow.document; doc.open(); doc.write(iframeDoc); doc.close();
      }, 50);
      return adDiv;
    }

    /* Auto Scan Category / Title Matcher */
    function isItemInCategory(item, catKey) {
      if (catKey === 'all') return true;
      if (item.category === catKey) return true;

      // Scanning Product Title against Selected Category (Watch, Mobile, etc.)
      const titleLower = (item.title || "").toLowerCase();
      if (catKey === 'watch' && (titleLower.includes('watch') || titleLower.includes('clock') || titleLower.includes('گھڑی'))) return true;
      if (catKey === 'mobile' && (titleLower.includes('mobile') || titleLower.includes('phone') || titleLower.includes('موبائل'))) return true;
      if (catKey === 'laptop' && (titleLower.includes('laptop') || titleLower.includes('notebook') || titleLower.includes('لیپ ٹاپ'))) return true;
      if (catKey === 'kids' && (titleLower.includes('kid') || titleLower.includes('baby') || titleLower.includes('child') || titleLower.includes('بچوں'))) return true;
      if (catKey === 'shoes' && (titleLower.includes('shoe') || titleLower.includes('sneaker') || titleLower.includes('شوز'))) return true;
      if (catKey === 'kitchen' && (titleLower.includes('kitchen') || titleLower.includes('cook') || titleLower.includes('کچن'))) return true;

      return false;
    }

    function displayData(data) {
      const grid = document.getElementById('productsGrid');
      if (!data) { 
        grid.innerHTML = `<p style="text-align: center; grid-column: span 2; padding: 20px; color: #64748b;">${translations[currentLang].emptyMsg}</p>`; 
        document.getElementById('grandTotalShares').innerText = "0";
        return; 
      }

      grid.innerHTML = '';
      let count = 0;
      let grandTotalShares = 0;

      const keysList = Object.keys(data);
      
      // Calculate Grand Total Shares Across All Products
      keysList.forEach(k => {
        grandTotalShares += (data[k].shares || 0);
      });
      document.getElementById('grandTotalShares').innerText = grandTotalShares;

      keysList.sort((a, b) => {
        const isPinnedA = data[a].pinned ? 1 : 0;
        const isPinnedB = data[b].pinned ? 1 : 0;
        if (isPinnedA !== isPinnedB) return isPinnedB - isPinnedA;
        return (data[b].timestamp || 0) - (data[a].timestamp || 0);
      });

      keysList.forEach((key) => {
        const item = data[key];

        // Automatic category scanning check
        if (!isItemInCategory(item, currentCategory)) return;
        count++;

        const finalBuyLink = getFinalLink(item.link, count - 1);
        const imgList = item.images && item.images.length > 0 ? item.images : [item.img || 'https://via.placeholder.com/150'];
        let sliderHtml = imgList.length > 1 ? `
          <div class="slider-wrapper">
            <button class="slide-btn right" onclick="moveSlide('${key}', 1, ${imgList.length})">❯</button>
            <div class="slider-track" id="track-${key}">
              ${imgList.map(src => `<img src="${src}" class="product-media" onerror="this.src='https://via.placeholder.com/150'">`).join('')}
            </div>
            <button class="slide-btn left" onclick="moveSlide('${key}', -1, ${imgList.length})">❮</button>
          </div>
        ` : `<div class="slider-wrapper"><img src="${imgList[0]}" class="product-media" onerror="this.src='https://via.placeholder.com/150'"></div>`;

        const pinnedClass = item.pinned ? 'pinned' : '';
        const pinnedBadge = item.pinned ? `<div class="pinned-badge">${translations[currentLang].featuredBadge}</div>` : '';
        const categoryHashtag = item.category ? `<span class="hashtag-badge">#${item.category}</span>` : '';
        const shareCount = item.shares || 0;

        const cardDiv = document.createElement('div');
        cardDiv.className = `product-card ${pinnedClass}`;
        cardDiv.innerHTML = `
          ${pinnedBadge}
          <div>
            ${sliderHtml}
            ${categoryHashtag}
            <div class="product-title">${item.title}</div>
            ${item.desc ? `<div class="product-desc">${item.desc}</div>` : ''}
            <div class="product-price">${item.price}</div>
          </div>
          <div class="btn-action-row">
            <a href="${finalBuyLink}" target="_blank" class="buy-btn">${translations[currentLang].buyBtn}</a>
            <button class="share-btn" onclick="shareProduct('${key}', '${item.title.replace(/'/g, "\\'")}', '${finalBuyLink}')">
              🔗 ${shareCount}
            </button>
          </div>
        `;

        grid.appendChild(cardDiv);

        if (count % 6 === 0) {
          grid.appendChild(createAdBannerElement());
        }
      });

      if (count === 0) grid.innerHTML = `<p style="text-align: center; grid-column: span 2; padding: 20px; color: #64748b;">${translations[currentLang].emptyMsg}</p>`;
    }

    function renderProducts() {
      db.on('value', (snapshot) => {
        cachedProducts = snapshot.val();
        displayData(cachedProducts);
      });
    }

    window.onload = function() { 
      switchLanguage('en'); 
      checkUserSession();
    };
  </script>
</body>
