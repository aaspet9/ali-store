<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali Store - Affiliate Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; padding-bottom: 40px; }
    header { background: #dc2626; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
    
    .search-box { max-width: 500px; margin: 15px auto; padding: 0 15px; }
    .search-box input { width: 100%; padding: 12px 15px; border: 2px solid #dc2626; border-radius: 8px; font-size: 15px; outline: none; }

    .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
    .product-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; gap: 15px; border: 1px solid #e2e8f0; }
    .product-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
    .product-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-size: 14px; font-weight: 600; line-height: 1.4; color: #1e293b; margin-bottom: 5px; }
    .product-code { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
    .product-price { color: #dc2626; font-weight: bold; font-size: 16px; margin-bottom: 8px; }
    
    .actions { display: flex; gap: 8px; }
    .btn-buy { background: #16a34a; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center; flex: 1; }
    .btn-share { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; flex: 1; }
  </style>
</head>
<body>

  <header>🛒 Ali Store Deals</header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="پروڈکٹ کا کوڈ یا نام سرچ کریں (مثلاً: 101)..." onkeyup="filterProducts()">
  </div>

  <div class="container" id="productsList">
    <!-- پروڈکٹس یہاں خودکار لوڈ ہوں گی -->
  </div>

  <script>
    // آپ کی گٹ ہب ایپ کا مین ایڈریس
    const APP_BASE_URL = "https://aaspet9.github.io/ali-store";

    // فائل پر مبنی کسٹم ڈیٹا بیس (نمونہ ڈیمو ڈیوائسز)
    const productsData = [
      {
        id: "1005013524814507",
        code: "101",
        title: "Women Watch Set Quartz Bracelet Watch Elegant Moon Charm",
        price: "SAR 43.99",
        image: "https://ae-pic-a1.aliexpress-media.com/kf/Sdd206465f41348d18a8c5e9dbe3b09ace.jpg",
        link: "https://s.click.aliexpress.com/e/_c4roY4yL"
      },
      {
        id: "1005013065941445",
        code: "102",
        title: "S999 Plus Smart Watch, 4G Android GPS Smartwatch",
        price: "SAR 756.90",
        image: "https://ae-pic-a1.aliexpress-media.com/kf/Se0923a06ae9146e7b8e4b1e8ee401b84d.jpg",
        link: "https://s.click.aliexpress.com/e/_c4N7bUV5"
      },
      {
        id: "1005012601689043",
        code: "103",
        title: "Square Wrist Watch for Men Women Shiny Full Stone Couple Watch",
        price: "SAR 196.19",
        image: "https://ae-pic-a1.aliexpress-media.com/kf/Sc88a539d4a1544979f92fbbd8fb966a81.jpg",
        link: "https://s.click.aliexpress.com/e/_c4dMaJDv"
      }
    ];

    // 1. پیج لوڈ ہوتے ہی URL سے سرچ کوڈ (?id=101) اور ڈیٹا دکھانا
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const searchCode = urlParams.get('id');

      if (searchCode) {
        document.getElementById('searchInput').value = searchCode;
        renderProducts(searchCode);
      } else {
        renderProducts();
      }
    };

    // 2. پروڈکٹس کو سکرین پر رینڈر کرنا
    function renderProducts(query = "") {
      const container = document.getElementById('productsList');
      container.innerHTML = "";

      const filtered = productsData.filter(p => 
        p.code.toLowerCase().includes(query.toLowerCase()) || 
        p.title.toLowerCase().includes(query.toLowerCase()) ||
        p.id.includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = "<p style='text-align:center; margin-top:20px; color:red;'>❌ کوئی پروڈکٹ نہیں ملی!</p>";
        return;
      }

      filtered.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${prod.image}" alt="Product Image">
          <div class="product-info">
            <div>
              <span class="product-code">کوڈ #${prod.code}</span>
              <div class="product-title">${prod.title}</div>
              <div class="product-price">${prod.price}</div>
            </div>
            <div class="actions">
              <a href="${prod.link}" target="_blank" class="btn-buy">🛒 ابھی خریدیں</a>
              <button class="btn-share" onclick="shareProduct('${prod.code}', '${prod.title}')">📲 شیئر کریں</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 3. لائو سرچ فلٹر
    function filterProducts() {
      const q = document.getElementById('searchInput').value;
      renderProducts(q);
    }

    // 4. شیئرنگ بٹن کا فنکشن (ایپ کا ڈائریکٹ لنک + کوڈ تیار کرنا)
    function shareProduct(code, title) {
      const shareUrl = `${APP_BASE_URL}/?id=${code}`;
      const shareText = `🛍️ ${title}\n🔢 پروڈکٹ کوڈ: #${code}\n📲 خریدنے کے لیے لنک اوپن کریں: ${shareUrl}`;

      if (navigator.share) {
        navigator.share({
          title: title,
          text: shareText,
          url: shareUrl
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareText);
        alert("پروڈکٹ کا کوڈ اور ڈائریکٹ لنک کاپی ہو گیا ہے! 🚀\n\n" + shareText);
      }
    }
  </script>
</body>
</html>
