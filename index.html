<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">Saudi Best Deals & Store</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f5f5f5; color: #222222; padding: 8px; padding-bottom: 30px; }

    .lang-bar { display: flex; justify-content: space-around; gap: 4px; margin-bottom: 8px; background: #ffffff; padding: 6px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .lang-btn { flex: 1; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 8px 4px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; color: #334155; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .lang-btn.active { background: #ff4747; color: #ffffff; border-color: #ff4747; }

    .header { 
      background: linear-gradient(-45deg, #ff4747, #e60000, #ff8c00, #e60000); 
      background-size: 300% 300%;
      animation: gradientBG 4s ease infinite;
      color: #ffffff; text-align: center; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 15px; margin-bottom: 8px; box-shadow: 0 4px 12px rgba(255, 71, 71, 0.4); display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden;
    }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .offer-glow-badge { background: linear-gradient(90deg, #ffe600, #ffffff, #ffe600); color: #000; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; animation: pulseGlow 1.2s infinite alternate; margin-right: 4px; margin-left: 4px; }
    @keyframes pulseGlow { from { transform: scale(1); box-shadow: 0 0 4px #ffe600; } to { transform: scale(1.08); box-shadow: 0 0 12px #ffe600; } }

    /* 🔥 SPECIAL OFFER CARD (Replaced Wallet) */
    .offer-card { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #ffffff; border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); border: 2px solid #fef08a; }
    .offer-title { font-size: 14px; font-weight: bold; color: #ffffff; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .offer-desc { font-size: 12px; line-height: 1.4; color: #fffbe6; }

    .search-box-wrapper { margin-bottom: 10px; }
    .search-input { width: 100%; padding: 12px 16px; border: 2px solid #ff4747; border-radius: 25px; font-size: 13px; outline: none; background: #ffffff; box-shadow: 0 3px 8px rgba(255, 71, 71, 0.12); font-weight: 500; }

    .promo-btn { width: 100%; background: #16a34a; color: #ffffff; text-decoration: none; border: none; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; text-align: center; margin-bottom: 10px; }

    .products-container { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
    
    .product-card { background: #ffffff; border-radius: 12px; padding: 8px; border: 1px solid #f0f0f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; width: 100%; overflow: hidden; position: relative; transition: all 0.3s ease; }
    
    /* 🚨 HIGH ALERT BLINKING PRODUCT STYLE */
    .product-card.highlighted-product {
      border: 3px solid #ff1100 !important;
      background: #fff5f5 !important;
      grid-column: span 2;
      animation: blinkBorder 1.2s infinite alternate !important;
      box-shadow: 0 0 16px rgba(255, 17, 0, 0.4) !important;
    }
    @keyframes blinkBorder {
      0% { border-color: #ff1100; box-shadow: 0 0 5px #ff1100; }
      100% { border-color: #ffe600; box-shadow: 0 0 20px #ffe600; }
    }
    .target-badge { position: absolute; top: 8px; right: 8px; background: #dc2626; color: #ffffff; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 6px; z-index: 3; animation: pulseGlow 1s infinite alternate; }

    .pinned-badge { position: absolute; top: 10px; left: 10px; background: #8b5cf6; color: #ffffff; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; z-index: 2; }

    .slider-wrapper { position: relative; width: 100%; height: 155px; border-radius: 8px; overflow: hidden; margin-bottom: 8px; background: #fdfdfd; }
    .product-card.highlighted-product .slider-wrapper { height: 220px; } /* ہائی لائٹ والی تصویر بڑی دکھے گی */
    .product-media { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

    .product-title { font-size: 12px; font-weight: 600; color: #222222; margin-bottom: 4px; line-height: 1.3; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .product-card.highlighted-product .product-title { font-size: 15px; height: auto; -webkit-line-clamp: 3; font-weight: bold; color: #990000; }

    .product-price { font-size: 14px; font-weight: 800; color: #ff4747; margin-bottom: 8px; }
    .product-card.highlighted-product .product-price { font-size: 18px; }

    .buy-btn { background: linear-gradient(135deg, #ff4747 0%, #e60000 100%); color: #ffffff; text-decoration: none; text-align: center; padding: 10px 6px; border-radius: 20px; font-weight: bold; font-size: 13px; display: block; box-shadow: 0 3px 8px rgba(255, 71, 71, 0.3); }

    .adsterra-in-grid-banner { grid-column: span 2; background: #ffffff; border-radius: 8px; padding: 4px; text-align: center; margin: 8px 0; display: flex; justify-content: center; align-items: center; min-height: 60px; border: 1px dashed #cbd5e1; width: 100%; overflow: hidden; }
  </style>
</head>
<body>

  <!-- 1. Language Bar -->
  <div class="lang-bar">
    <button class="lang-btn active" id="btnEn" onclick="switchLanguage('en')">🇺🇸 English</button>
    <button class="lang-btn" id="btnUr" onclick="switchLanguage('ur')">🇵🇰 اردو</button>
    <button class="lang-btn" id="btnAr" onclick="switchLanguage('ar')">🇸🇦 العربية</button>
    <button class="lang-btn" id="btnHi" onclick="switchLanguage('hi')">🇮🇳 हिंदी</button>
  </div>

  <!-- 2. Header -->
  <div class="header">
    <span>
      <span class="offer-glow-badge">🔥 STORE 🔥</span>
      <span id="headerText">🛍️ Saudi Best Deals & Discounts</span>
    </span>
  </div>

  <!-- 3. 🔥 SPECIAL OFFER CARD (Live from User Admin Panel) -->
  <div class="offer-card" id="specialOfferBox" style="display: none;">
    <div class="offer-title">🔥 <span id="offerTitle">Special Offer</span></div>
    <div class="offer-desc" id="offerDesc">Deals & updates from admin.</div>
  </div>

  <!-- 4. Search Box -->
  <div class="search-box-wrapper">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search product or code..." oninput="debouncedSearch()">
  </div>

  <!-- 5. Promote Deal Button -->
  <a href="mailto:aaspet2025@gmail.com" class="promo-btn" id="btnPromoTxt">📌 Promote Deal</a>

  <!-- 6. Products Container -->
  <div class="products-container" id="productsGrid">
    <p style="text-align: center; grid-column: span 2; padding: 20px; color: #ff4747; font-weight:bold;">Deals Loading... ⏳</p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDp--gVk61VaLCK-4yygwN8Oj9CpDIp05E",
      authDomain: "kist-65357.firebaseapp.com",
      projectId: "kist-65357",
      storageBucket: "kist-65357.firebasestorage.app",
      messagingSenderId: "200844711272",
      appId: "1:200844711272:web:d980a03c9fae8b8d7972dd",
      measurementId: "G-LCZ8N3GKTE",
      databaseURL: "https://kist-65357-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("products");
    const offersDb = firebase.database().ref("special_offers");

    let searchQuery = '';
    let searchTimeout = null;
    let cachedData = null;
    let targetProductId = ""; // URL Code/ID
    let activeLang = 'en';

    const i18n = {
      en: { title: "🛍️ Saudi Best Deals & Store", pro: "📌 Promote Deal", buy: "🛒 Buy Now", search: "🔍 Search product or code...", targetBadge: "🔥 YOUR SELECTED DEAL" },
      ur: { title: "🛍️ سعودی بیسٹ ڈیلز & اسٹور", pro: "📌 ڈیل پروموٹ کروائیں", buy: "🛒 ابھی خریدیں", search: "🔍 پروڈکٹ یا کوڈ تلاش کریں...", targetBadge: "🔥 آپ کی منتخب کردہ ڈیل" },
      ar: { title: "🛍️ أفضل العروض والمتجر في السعودية", pro: "📌 روج لمنتجك", buy: "🛒 شراء الآن", search: "🔍 ابحث عن منتج...", targetBadge: "🔥 عرضك المختار" },
      hi: { title: "🛍️ सऊदी बेस्ट डील्स और स्टोर", pro: "📌 डील प्रमोट करें", buy: "🛒 अभी खरीदें", search: "🔍 प्रोडक्ट या कोड खोजें...", targetBadge: "🔥 आपकी चुनिंदा डील" }
    };

    // Load Live Special Offers
    function loadSpecialOffer() {
      offersDb.on('value', snap => {
        const data = snap.val();
        if (data && data.title) {
          document.getElementById('offerTitle').innerText = data.title;
          document.getElementById('offerDesc').innerText = data.desc;
          document.getElementById('specialOfferBox').style.display = 'block';
        }
      });
    }

    function debouncedSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
        if (cachedData) displayData(cachedData);
      }, 150);
    }

    function createAdBannerElement() {
      const adDiv = document.createElement('div');
      adDiv.className = 'adsterra-in-grid-banner';
      const iframe = document.createElement('iframe');
      iframe.width = "320"; iframe.height = "50"; iframe.style.border = "none"; iframe.style.overflow = "hidden"; iframe.scrolling = "no";
      iframe.srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:50px;background:#fff;}</style></head><body><script type="text/javascript">atOptions={'key':'b56241b7779e2ce343e13c97202a3e26','format':'iframe','height':50,'width':320,'params':{}};\<\/script><script type="text/javascript" src="https://bauval.org/22/b56241b7779e2ce343e13c97202a3e26">\<\/script></body></html>`;
      adDiv.appendChild(iframe);
      return adDiv;
    }

    function displayData(data) {
      const grid = document.getElementById('productsGrid');
      if (!data) { grid.innerHTML = `<p style="text-align: center; grid-column: span 2;">No products found.</p>`; return; }

      const fragment = document.createDocumentFragment();
      const txt = i18n[activeLang];
      let count = 0;

      let keys = Object.keys(data);

      // Sort logic: Target Product first, then Pinned Products, then others
      keys.sort((a, b) => {
        const itemA = data[a];
        const itemB = data[b];

        const isA_Target = (targetProductId && (a === targetProductId || itemA.id === targetProductId || itemA.code === targetProductId));
        const isB_Target = (targetProductId && (b === targetProductId || itemB.id === targetProductId || itemB.code === targetProductId));

        if (isA_Target) return -1;
        if (isB_Target) return 1;

        return (itemB.pinned === true ? 1 : 0) - (itemA.pinned === true ? 1 : 0);
      });

      keys.forEach((key) => {
        const item = data[key];
        
        // Search Filter
        if (searchQuery && !item.title.toLowerCase().includes(searchQuery) && !(item.code && item.code.includes(searchQuery))) return;
        count++;

        const imgList = item.images && item.images.length > 0 ? item.images : [item.img || 'https://via.placeholder.com/150'];
        
        // Check if this is the product user came for (?id=101)
        const isTargetProduct = (targetProductId && (key === targetProductId || item.id === targetProductId || item.code === targetProductId));

        const cardDiv = document.createElement('div');
        cardDiv.className = `product-card ${isTargetProduct ? 'highlighted-product' : ''}`;
        cardDiv.id = `product_${key}`;

        cardDiv.innerHTML = `
          ${isTargetProduct ? `<div class="target-badge">${txt.targetBadge}</div>` : (item.pinned ? '<div class="pinned-badge">📌 PINNED</div>' : '')}
          <div>
            <div class="slider-wrapper"><img src="${imgList[0]}" class="product-media" onerror="this.src='https://via.placeholder.com/150'"></div>
            <div class="product-title">${item.title}</div>
            <div class="product-price">${item.price}</div>
          </div>
          <div>
            <a href="${item.link}" target="_blank" class="buy-btn">${txt.buy}</a>
          </div>
        `;
        fragment.appendChild(cardDiv);

        if (count % 6 === 0) {
          fragment.appendChild(createAdBannerElement());
        }
      });

      grid.innerHTML = '';
      grid.appendChild(fragment);
    }

    function switchLanguage(lang) {
      activeLang = lang;
      const txt = i18n[lang];
      document.getElementById('headerText').innerText = txt.title;
      document.getElementById('btnPromoTxt').innerText = txt.pro;
      document.getElementById('searchInput').placeholder = txt.search;

      const htmlTag = document.getElementById('htmlTag');
      if (lang === 'ur' || lang === 'ar') { htmlTag.setAttribute('dir', 'rtl'); } 
      else { htmlTag.setAttribute('dir', 'ltr'); }

      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      if(lang === 'en') document.getElementById('btnEn').classList.add('active');
      if(lang === 'ur') document.getElementById('btnUr').classList.add('active');
      if(lang === 'ar') document.getElementById('btnAr').classList.add('active');
      if(lang === 'hi') document.getElementById('btnHi').classList.add('active');

      if (cachedData) displayData(cachedData);
    }

    window.onload = function() {
      // Read URL Parameter (?id=101)
      const urlParams = new URLSearchParams(window.location.search);
      targetProductId = urlParams.get('id') || "";

      loadSpecialOffer();

      db.on('value', (snapshot) => {
        cachedData = snapshot.val();
        displayData(cachedData);
      });
    };
  </script>
</body>
</html>
