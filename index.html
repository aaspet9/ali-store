      container.appendChild(iframe);

    function renderAllAds() {
      injectFullWidthBanner('bannerTop');
      injectFullWidthBanner('bannerBottom');
    }

    function switchLanguage(lang) {
      currentLang = lang;
      const langObj = translations[lang] || translations['en'];

      document.getElementById('htmlTag').setAttribute('dir', langObj.dir);
      document.getElementById('htmlTag').setAttribute('lang', lang);
      document.getElementById('appHeader').innerText = langObj.title;

      document.getElementById('btnUploadMain').innerText = langObj.btnUploadMain;
      document.getElementById('btnPromoMain').innerText = langObj.btnPromoMain;
      document.getElementById('modalHeading').innerText = langObj.modalHeading;
      document.getElementById('lblTitle').innerText = langObj.lblTitle;
      document.getElementById('uTitle').placeholder = langObj.phTitle;
      document.getElementById('lblCategory').innerText = langObj.lblCategory;
      document.getElementById('lblPrice').innerText = langObj.lblPrice;
      document.getElementById('lblLink').innerText = langObj.lblLink;
      document.getElementById('lblImages').innerText = langObj.lblImages;
      document.getElementById('uFileText').innerText = langObj.uFileText;
      document.getElementById('btnSubmitModal').innerText = langObj.btnSubmitModal;

      document.getElementById('entryTitle').innerText = langObj.entryTitle;
      document.getElementById('uEntryName').placeholder = langObj.phName;
      document.getElementById('uEntryPhone').placeholder = langObj.phPhone;
      document.getElementById('btnEntrySubmit').innerText = langObj.btnEntrySubmit;
      document.getElementById('userProfileStatus').innerText = langObj.userProfileStatus;
      document.getElementById('lcdLabelText').innerText = langObj.lcdLabelText;
      document.getElementById('lcdLoadingText').innerText = langObj.lcdLoadingText;
      document.getElementById('lcdWinBadge').innerText = langObj.lcdWinBadge;
      document.getElementById('btnLogoutBtn').innerText = langObj.btnLogoutBtn;

      const modalBox = document.querySelector('.modal-box');
      if (modalBox) modalBox.style.textAlign = langObj.dir === 'rtl' ? 'right' : 'left';

      ['btnUr', 'btnEn', 'btnAr', 'btnHi'].forEach(btnId => {
        const btn = document.getElementById(btnId);
        if(btn) btn.classList.remove('active');
      });
      
      const targetBtn = document.getElementById('btn' + lang.charAt(0).toUpperCase() + lang.slice(1));
      if (targetBtn) targetBtn.classList.add('active');

      checkSavedUser();
      renderCategories();
      renderModalCategories();
      displayData(globalProductsData);
    }

    function listenToLCDPrizes() {
      prizesDb.on('value', (snap) => {
        const data = snap.val();
        const lcdScreen = document.getElementById('lcdScreen');
        const overlay = document.getElementById('winnerOverlay');
        
        if (!data) {
          document.getElementById('lcdLoadingText').innerText = translations[currentLang].lcdLoadingText;
          return;
        }

        lcdScreen.innerHTML = "";
        lcdScreen.appendChild(overlay);

        prizeSlideImages = [];
        Object.keys(data).forEach((key, index) => {
          let p = data[key];
          if(p.image) {
            let img = document.createElement('img');
            img.src = p.image;
            img.className = "prize-slide-img";
            if (index === 0) img.classList.add('active');
            lcdScreen.appendChild(img);
            prizeSlideImages.push(img);
          }
        });

        if (prizeSlideImages.length > 0 && !isWinnerAnnouncementActive) {
          startPrizeAutoSlider();
        }
      });
    }

    function startPrizeAutoSlider() {
      clearInterval(prizeInterval);
      prizeInterval = setInterval(() => {
        if (isWinnerAnnouncementActive || prizeSlideImages.length <= 1) return;
        prizeSlideImages[currentPrizeIndex].classList.remove('active');
        currentPrizeIndex = (currentPrizeIndex + 1) % prizeSlideImages.length;
        prizeSlideImages[currentPrizeIndex].classList.add('active');
      }, 3000);
    }

    function listenForLiveWinners() {
      winnersDb.limitToLast(1).on('value', (snap) => {
        const data = snap.val();
        if (!data) return;

        const key = Object.keys(data)[0];
        const winner = data[key];

        if (winner.timestamp && winner.timestamp > lastWinnerTimestamp) {
          lastWinnerTimestamp = winner.timestamp;
          triggerSpinAndShowWinner(winner);
        }
      });
    }

    function triggerSpinAndShowWinner(winnerData) {
      isWinnerAnnouncementActive = true;
      clearInterval(prizeInterval);

      prizeSlideImages.forEach(img => img.classList.add('fast-spin'));

      setTimeout(() => {
        prizeSlideImages.forEach(img => img.classList.remove('fast-spin'));

        document.getElementById('lcdWinImg').src = winnerData.prize_image || 'https://via.placeholder.com/100';
        document.getElementById('lcdWinName').innerText = winnerData.winner_name;
        document.getElementById('lcdWinPhone').innerText = winnerData.winner_phone;
        document.getElementById('lcdWinPrize').innerText = winnerData.prize_name;

        const overlay = document.getElementById('winnerOverlay');
        overlay.style.display = "flex";

        setTimeout(() => {
          overlay.style.display = "none";
          isWinnerAnnouncementActive = false;
          startPrizeAutoSlider();
        }, 12000);
      }, 3000);
    }

    function matchCategory(itemCat, selectedCat, itemTitle) {
      if (selectedCat === 'all') return true;
      const c = (itemCat || '').toLowerCase().trim();
      const t = (itemTitle || '').toLowerCase().trim();
      if (selectedCat === 'watch') return c.includes('watch') || t.includes('watch') || c.includes('گھڑی');
      if (selectedCat === 'kids') return c.includes('kid') || c.includes('child') || t.includes('baby');
      if (selectedCat === 'mobile') return c.includes('mobile') || c.includes('phone') || t.includes('phone');
      if (selectedCat === 'laptop') return c.includes('laptop') || c.includes('computer');
      if (selectedCat === 'electronics') return c.includes('electronic') || t.includes('cam') || t.includes('board');
      return c.includes(selectedCat);
    }

    function listenToProducts() {
      db.on('value', (snapshot) => {
        globalProductsData = snapshot.val();
        displayData(globalProductsData);
      });
    }

    function registerUserEntry() {
      const name = document.getElementById('uEntryName').value.trim();
      const phone = document.getElementById('uEntryPhone').value.trim();
      if (!name || !phone) { alert("Please enter name and phone number!"); return; }

      localStorage.setItem("afuma_user_name", name);
      localStorage.setItem("afuma_user_phone", phone);

      giveawayDb.child(phone).set({ name: name, phone: phone, timestamp: Date.now() }).then(() => {
        showSavedUserProfile(name, phone);
        alert("🎉 Congratulations! You have entered the Lucky Draw.");
      });
    }

    function logoutUser() {
      localStorage.removeItem("afuma_user_name");
      localStorage.removeItem("afuma_user_phone");
      document.getElementById('userProfileBox').style.display = 'none';
      document.getElementById('entrySection').style.display = 'block';
      document.getElementById('uEntryName').value = '';
      document.getElementById('uEntryPhone').value = '';
    }

    function showSavedUserProfile(name, phone) {
      document.getElementById('entrySection').style.display = 'none';
      const profBox = document.getElementById('userProfileBox');
      profBox.style.display = 'block';
      const labelCust = translations[currentLang].lblCustomer;
      document.getElementById('profileCardText').innerText = `👤 ${labelCust}: ${name} | 📱 ${phone}`;
    }

    function checkSavedUser() {
      const name = localStorage.getItem("afuma_user_name");
      const phone = localStorage.getItem("afuma_user_phone");
      if (name && phone) showSavedUserProfile(name, phone);
      else {
        document.getElementById('userProfileBox').style.display = 'none';
        document.getElementById('entrySection').style.display = 'block';
      }
    }

    function openUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
    function closeUploadModal() { document.getElementById('uploadModal').style.display = 'none'; }

    function handleUserImages(e) {
      userFiles = Array.from(e.target.files);
      if(userFiles.length > 0) {
        document.getElementById('uFileText').innerText = `${userFiles.length} ${translations[currentLang].uFileText} ✅`;
      }
    }

    async function submitUserProduct() {
      const title = document.getElementById('uTitle').value.trim();
      const category = document.getElementById('uCategory').value;
      const price = document.getElementById('uPrice').value.trim();
      const link = document.getElementById('uLink').value.trim();
      const loader = document.getElementById('uLoader');

      if (!title || !link || userFiles.length === 0) { alert("Please complete all details!"); return; }

      loader.style.display = "block";
      let imgUrls = [];

      for (let file of userFiles) {
        const formData = new FormData();
        formData.append("image", file);
        try {
          const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
          const imgData = await res.json();
          if (imgData.success) imgUrls.push(imgData.data.url);
        } catch(e){}
      }

      if (imgUrls.length === 0) { loader.style.display = "none"; alert("Image upload failed!"); return; }

      pendingDb.push({
        title: title, category: category, price: price || "Best Price", link: link, images: imgUrls, img: imgUrls[0], pinned: false, timestamp: Date.now()
      }).then(() => {
        loader.style.display = "none";
        alert("Product submitted for approval! 🚀");
        closeUploadModal();
      });
    }

    function renderModalCategories() {
      const select = document.getElementById('uCategory');
      select.innerHTML = '';
      const catObj = translations[currentLang].cats;
      Object.keys(catObj).forEach(key => {
        if(key !== 'all') select.innerHTML += `<option value="${key}">${catObj[key]}</option>`;
      });
    }

    function renderCategories() {
      const catBar = document.getElementById('categoryBar');
      catBar.innerHTML = '';
      const catObj = translations[currentLang].cats;
      Object.keys(catObj).forEach(key => {
        const activeClass = key === currentCategory ? 'active' : '';
        catBar.innerHTML += `<button class="cat-btn ${activeClass}" onclick="filterCategory('${key}')">${catObj[key]}</button>`;
      });
    }

    function filterCategory(catKey) {
      currentCategory = catKey;
      renderCategories();
      displayData(globalProductsData);
    }

    function createAdBannerElement() {
      const adDiv = document.createElement('div');
      adDiv.className = 'adsterra-in-grid-banner';
      injectFullWidthBannerDirect(adDiv);
      return adDiv;
    }

    function injectFullWidthBannerDirect(container) {
      const iframe = document.createElement('iframe');
      iframe.style.width = '100%'; iframe.style.height = '60px'; iframe.style.border = 'none'; iframe.style.overflow = 'hidden';
      const iframeDoc = `
        <!DOCTYPE html>
        <html>
        <head><style>body{margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;}</style></head>
        <body>
          <script type="text/javascript">
            atOptions = {
              'key' : 'b56241b7779e2ce343e13c97202a3e26',
              'format' : 'iframe',
              'height' : 50,
              'width' : 320,
              'params' : {}
            };
          <\/script>
          <script type="text/javascript" src="https://bauval.org/22/b56241b7779e2ce343e13c97202a3e26"><\/script>
        </body>
        </html>
      `;
      container.appendChild(iframe);
      setTimeout(() => {
        try {
          const doc = iframe.contentWindow.document;
          doc.open(); doc.write(iframeDoc); doc.close();
        } catch(e){}
      }, 50);
    }

    function displayData(data) {
      const grid = document.getElementById('productsGrid');
      if (!data) { grid.innerHTML = `<p style="text-align: center; grid-column: span 2; padding: 20px; color: #64748b;">${translations[currentLang].emptyMsg}</p>`; return; }
      grid.innerHTML = '';
      let count = 0;
      Object.keys(data).reverse().forEach((key) => {
        const item = data[key];
        if (!matchCategory(item.category, currentCategory, item.title)) return;
        count++;
        const imgList = item.images && item.images.length > 0 ? item.images : [item.img || 'https://via.placeholder.com/150'];
        const cardDiv = document.createElement('div');
        cardDiv.className = 'product-card';
        cardDiv.innerHTML = `
          <div class="slider-wrapper"><img src="${imgList[0]}" class="product-media"></div>
          <div class="product-title">${item.title}</div>
          <div class="product-price">${item.price}</div>
          <a href="${item.link}" target="_blank" class="buy-btn">${translations[currentLang].buyBtn}</a>
        `;
        grid.appendChild(cardDiv);

        if (count % 6 === 0) {
          grid.appendChild(createAdBannerElement());
        }
      });
    }

    window.onload = function() { 
      listenToProducts();
      listenToLCDPrizes();
      listenForLiveWinners();
      renderAllAds();
      switchLanguage('en'); 
    };
  </script>
</body>
