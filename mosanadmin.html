<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ایڈمن پینل - سکرین شاٹ اپروول</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; padding: 12px; }

    .stats-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #ffffff; text-align: center; padding: 14px; border-radius: 12px; max-width: 500px; margin: 0 auto 15px auto; }
    .stats-card h3 { font-size: 24px; color: #38bdf8; margin-top: 4px; font-weight: 800; }

    .main-wrapper { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

    .section-toggle-btn { width: 100%; background: #ffffff; color: #1e293b; border: 2px solid #cbd5e1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .collapsible-content { display: none; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 0 0 10px 10px; padding: 12px; margin-top: -6px; }

    .item-row { background: #fff; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
    .proof-img-thumb { width: 100%; max-height: 180px; object-fit: contain; border-radius: 6px; border: 1px solid #cbd5e1; margin: 6px 0; background: #000; }
    
    .approve-btn { background: #22c55e; color: white; border: none; padding: 8px 12px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 4px; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 11px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="stats-card">
    <span style="font-size:12px; color:#94a3b8;">📊 ایپ پر کل اپلوڈ شدہ پروڈکٹس:</span>
    <h3 id="totalProductsCount">0</h3>
  </div>

  <div class="main-wrapper">

    <!-- 1. Screenshot Proofs Verification Section -->
    <button class="section-toggle-btn" onclick="toggleSection('proofsSection', this)">
      <span>📸 شیئر سکرین شاٹس اپروول (ImgBB)</span>
      <span>▼</span>
    </button>
    <div class="collapsible-content" id="proofsSection">
      <div id="proofsList"></div>
    </div>

    <!-- 2. Withdrawal Requests Section -->
    <button class="section-toggle-btn" onclick="toggleSection('withdrawalsSection', this)">
      <span>💸 پیسے نکالنے کی درخواستیں (Withdrawals)</span>
      <span>▼</span>
    </button>
    <div class="collapsible-content" id="withdrawalsSection">
      <div id="withdrawalsList"></div>
    </div>

    <!-- 3. Registered Users Section -->
    <button class="section-toggle-btn" onclick="toggleSection('usersSection', this)">
      <span>👥 رجسٹرڈ یوزرز اور ان کے کل شیئرز</span>
      <span>▼</span>
    </button>
    <div class="collapsible-content" id="usersSection">
      <div id="usersContainer"></div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDp--gVk61VaLCK-4yygwN8Oj9CpDIp05E",
      authDomain: "kist-65357.firebaseapp.com",
      projectId: "kist-65357",
      storageBucket: "kist-65357.firebasestorage.app",
      messagingSenderId: "200844711272",
      appId: "1:200844711272:web:d980a03c9fae8b8d7972dd",
      measurementId: "G-LCZ8N3GKTE",
      databaseURL: "https://kist-65357-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("products");
    const usersDb = firebase.database().ref("app_users");
    const withdrawalsDb = firebase.database().ref("withdrawals");
    const proofsDb = firebase.database().ref("share_proofs");

    window.onload = function() {
      renderProofsList();
      renderWithdrawalsList();
      renderUsersList();
    };

    function toggleSection(id, btn) {
      const content = document.getElementById(id);
      content.style.display = (content.style.display === "block") ? "none" : "block";
    }

    /* Render Proof Screenshots Hosted on ImgBB */
    function renderProofsList() {
      const container = document.getElementById('proofsList');
      proofsDb.on('value', (snap) => {
        const data = snap.val();
        if(!data) { container.innerHTML = '<p style="font-size:11px; color:#64748b;">کوئی پینڈنگ سکرین شاٹ موجود نہیں ہے۔</p>'; return; }

        container.innerHTML = '';
        Object.keys(data).reverse().forEach(key => {
          const p = data[key];
          container.innerHTML += `
            <div class="item-row" style="border-right: 4px solid #16a34a;">
              <div style="font-size:12px; font-weight:bold;">👤 یوزر: ${p.userName} (${p.userPhone})</div>
              <div style="font-size:11px; color:#2563eb;">📦 پروڈکٹ: ${p.prodTitle}</div>
              <a href="${p.proofUrl}" target="_blank">
                <img src="${p.proofUrl}" class="proof-img-thumb" onerror="this.src='https://via.placeholder.com/150'">
              </a>
              <button class="approve-btn" onclick="approveProof('${key}', '${p.userPhone}', '${p.prodKey}')">✅ سکرین شاٹ منظور کریں +100 Points</button>
              <button class="del-btn" onclick="rejectProof('${key}')">🗑️ رد کریں</button>
            </div>
          `;
        });
      });
    }

    function approveProof(key, phone, prodKey) {
      // Add Points to User Account
      usersDb.child(phone).child('totalShares').transaction((current) => (current || 0) + 1);
      // Increment Product Global Share Counter
      if(prodKey) db.child(prodKey).child('shares').transaction((current) => (current || 0) + 1);
      
      // Remove Proof entry from database
      proofsDb.child(key).remove().then(() => {
        alert("سکرین شاٹ منظور ہو گیا! یوزر کے والیٹ میں 100 پوائنٹس (10 SAR) شامل کر دیے گئے ہیں۔ 🚀");
      });
    }

    function rejectProof(key) {
      proofsDb.child(key).remove();
    }

    function renderWithdrawalsList() {
      const container = document.getElementById('withdrawalsList');
      withdrawalsDb.on('value', (snap) => {
        const data = snap.val();
        if(!data) { container.innerHTML = '<p style="font-size:11px; color:#64748b;">کوئی درخواست موجود نہیں ہے۔</p>'; return; }

        container.innerHTML = '';
        Object.keys(data).reverse().forEach(key => {
          const w = data[key];
          container.innerHTML += `
            <div class="item-row" style="border-right: 4px solid #22c55e;">
              <div style="font-size:12px; font-weight:bold;">👤 ${w.userName} (${w.userPhone})</div>
              <div style="font-size:11px; color:#2563eb;">💳 ${w.method}: ${w.account}</div>
              <button class="approve-btn" style="margin-top:6px;" onclick="approveWithdrawal('${key}', '${w.userPhone}')">✅ ادا کر دیا</button>
            </div>
          `;
        });
      });
    }

    function approveWithdrawal(key, phone) {
      if(confirm("کیا آپ نے پیسے بھیج دیے ہیں؟")) {
        usersDb.child(phone).child('totalShares').set(0);
        withdrawalsDb.child(key).remove();
        alert("وڈراول منظوری مکمل ہو گئی ہے!");
      }
    }

    function renderUsersList() {
      const container = document.getElementById('usersContainer');
      usersDb.on('value', (snapUsers) => {
        const users = snapUsers.val();
        if(!users) { container.innerHTML = '<p style="font-size:11px;">کوئی یوزر نہیں ہے۔</p>'; return; }

        container.innerHTML = '';
        Object.keys(users).forEach((phone) => {
          const user = users[phone];
          const shares = user.totalShares || 0;
          const sar = (shares * 0.10).toFixed(2);

          container.innerHTML += `
            <div class="item-row">
              <div style="font-size:12px; font-weight:bold;">👤 ${user.name} (${phone})</div>
              <div style="font-size:11px; color:#16a34a;">🪙 منظور شدہ شیئرز: ${shares} | 💰 کل رقم: ${sar} SAR</div>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
